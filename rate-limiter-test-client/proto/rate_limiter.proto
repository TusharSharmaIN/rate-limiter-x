syntax = "proto3";

package ratelimiter;

service RateLimiter {
  rpc CheckLimit (CheckLimitRequest) returns (CheckLimitResponse);
}

message CheckLimitRequest {
  string key = 1; // e.g. "user:123" or "ip:1.2.3.4"
}

message CheckLimitResponse {
  bool allowed = 1;
  int32 remaining = 2;
  int32 retryAfterMs = 3;
  bool checked = 4; // false if Redis was down and we fail-opened
}