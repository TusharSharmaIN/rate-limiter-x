services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rate-limiter-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-service
    ports:
      - '50051:50051'
      - '3000:3000'
    environment:
      REDIS_HOST: redis # always 'redis' in Docker — NOT from .env, see note below
      REDIS_PORT: 6379
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC}
      RATE_LIMIT_WINDOW_SIZE_SEC: ${RATE_LIMIT_WINDOW_SIZE_SEC}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
